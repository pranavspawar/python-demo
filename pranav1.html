<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile GUI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Profile Card */
        .profile {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        .profile h2 {
            margin: 10px 0;
        }

        .btn {
            background: #2575fc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1a5edb;
        }

        /* Form */
        .form {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        /* Responsive */
        @media(max-width: 600px) {
            .container {
                margin: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Profile Section -->
        <div class="profile">
            <img src="https://via.placeholder.com/120" alt="Profile">
            <h2>Pranav Pawar</h2>
            <p>Web Developer | DevOps Learner</p>
            <button class="btn">Follow</button>
        </div>

        <!-- Contact Form -->
        <div class="form">
            <h3>Contact Me</h3>
            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Enter your email">
            <textarea placeholder="Your message"></textarea>
            <button class="btn">Send Message</button>
        </div>

    </div>

</body>
</html>
